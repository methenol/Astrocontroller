services:
  astrocontroller:
    build:
      context: .
      # Build-time RUN steps fetch from apt/npm/bun registries. host keeps those
      # reachable when the docker bridge has no masquerade (iptables=false) or a
      # proxy only the host is configured for.
      network: host
    image: astrocontroller:latest
    container_name: ${CONTAINER_NAME:-astrocontroller}
    restart: unless-stopped
    # the hub stops every profile's process at once; each needs a couple of seconds
    stop_grace_period: 30s
    env_file: .env
    environment:
      # Fixed inside the container; the host side comes from .env.
      DATA_DIR: /data
      LIBRARY_DIR: /library
      WEB_PORT: "8080"
      TZ: ${OBSERVER_TIMEZONE:-UTC}
      # SEESTAR_CONNECTION=zwo: the tunnel container, reached on the default network.
      SEESTAR_TUNNEL_HOST: ${SEESTAR_TUNNEL_HOST:-seestar-portfwd}
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # Agent home, sessions, skills, notes, captures. Give each driver its own
      # (DATA_PATH=./data-seestar for the Seestar) so the two agents do not mix.
      - ${DATA_PATH:-./data}:/data
      # Your imagery library (FITS lights, stacks, calibration frames). Each profile gets its own
      # folder in it (/library/<profile id>); the migrated single-telescope setup keeps /library itself.
      - ${LIBRARY_PATH:-./library}:/library
      # The ZWO Telescope Network handshake key: the official Seestar app's key, extracted from the APK,
      # one for every ZWO connection (a Seestar on the LAN does not use it). SEESTAR_KEY_PATH=/keys/seestar.pem in .env.
      - ${KEYS_PATH:-./keys}:/keys:ro

  # ZWO Telescope Network tunnel (seestar-portfwd/, vendored here from github.com/Phaeilo/seestar-portfwd),
  # for TELESCOPE_DRIVER=seestar
  # with SEESTAR_CONNECTION=zwo. Started only with the seestar profile (COMPOSE_PROFILES=seestar
  # in .env, or --profile seestar), so the Dwarf setup is unchanged.
  #
  # Its services are reached by Astrocontroller on the project's default network and are not published on
  # the host. To reach them from the host as well, add docker-compose.seestar-ports.yml (see there).
  seestar-portfwd:
    profiles: [seestar]
    build:
      # vendored in this project (upstream: github.com/Phaeilo/seestar-portfwd, see its README)
      context: ${SEESTAR_PORTFWD_DIR:-./seestar-portfwd}
      dockerfile: Containerfile
      network: host
      # T: the ThroughTek SDK set the current Seestar app loads (libIOTCAPIsT.so, ...). The older set
      # seestar-portfwd ships fails with Connect_Ex -42 on an S50 Pro (firmware 9.75). Needs the
      # tutk-t-sdk patch of seestar-portfwd; empty builds the original set.
      args:
        TUTK_SUFFIX: ${SEESTAR_TUTK_SUFFIX:-T}
    image: seestar-portfwd:latest
    container_name: seestar-portfwd
    # The supervisor inside keeps the P2P session up itself (it reconnects a lost one); Docker only
    # has to bring the container back after a crash or a reboot.
    restart: unless-stopped
    # docker stop → SIGTERM: the supervisor stops the tunnel (SDK abort + disconnect, which is all the
    # official app's Disconnect does), waits for the scope to report itself free and sends the backend
    # a stop_p2p for the session only when it does not.
    # The grace has to cover that work: up to SEESTAR_TUNNEL_STOP_GRACE_S (75 s) for a child blocked
    # inside Connect_Ex to come back out and tear its session down, plus the release retries. Kill it
    # before that and the session stays allocated on the backend, holding the scope against every
    # later Connect_Ex (-42) until it times out - so this is sized above the supervisor's own budget.
    stop_grace_period: 180s
    # The supervisor keeps its session record here: the conId to give back and the controller's wish
    # that this connection be restored. On a container-local path it dies with the container, so an
    # image rebuild or a recreate would silently leave the scope released until somebody presses
    # Connect again; a named volume carries the wish across.
    volumes:
      - seestar-portfwd-state:/var/lib/seestar-portfwd
    # only what the tunnel reads, not the whole .env
    environment:
      SEESTAR_USER: ${SEESTAR_USER:-}
      SEESTAR_PASSWORD: ${SEESTAR_PASSWORD:-}
      SEESTAR_SN: ${SEESTAR_SN:-}
      SEESTAR_COUNTRY: ${SEESTAR_COUNTRY:-US}
      # Stay idle: Astrocontroller's Connect presses the tunnel's connect, its Disconnect releases
      # the telescope (POST /connect and /disconnect on SEESTAR_TUNNEL_CONTROL_PORT). Set to 1 to
      # have the tunnel take the scope as soon as the container starts, as it used to.
      SEESTAR_TUNNEL_AUTOSTART: ${SEESTAR_TUNNEL_AUTOSTART:-0}
      # One supervisor per ZWO profile (seestar-portfwd/src/manager.py): Astrocontroller's profile hub
      # asks for a slot per Seestar it drives over ZWO, each with its own account, serial and ports
      # (device port + slot*1000). SEESTAR_USER above, when set, still runs slot 0 as before.
      SEESTAR_TUNNEL_MULTI: ${SEESTAR_TUNNEL_MULTI:-1}
      SEESTAR_TUNNEL_MANAGER_PORT: ${SEESTAR_TUNNEL_MANAGER_PORT:-4709}
      SEESTAR_TUNNEL_CONTROL_PORT: ${SEESTAR_TUNNEL_CONTROL_PORT:-4710}
      # optional: both sides then require Authorization: Bearer <token>
      SEESTAR_TUNNEL_CONTROL_TOKEN: ${SEESTAR_TUNNEL_CONTROL_TOKEN:-}
      # the tunnel's DNS shim logs every lookup (the TUTK master/relay servers it was handed);
      # a few lines per connect, worth having when a Connect_Ex comes back -42/-60
      DNSHOOK_DEBUG: ${SEESTAR_DNSHOOK_DEBUG:-1}
      # 1 = give the SDK every A record of the TUTK master; off, because with the full list
      # Connect_Ex answered -42 for half an hour straight (2026-10-30).
      DNSHOOK_ALL_ADDRS: ${SEESTAR_DNSHOOK_ALL_ADDRS:-0}
      # The master name resolves round-robin to five servers and one of them never answers from
      # here (-60 after 77 s every time it was drawn, 2026-10-30): the shim probes them with a TCP
      # connect to :80 and hands the SDK the fastest answering one. 0 turns the probe off.
      DNSHOOK_PROBE: ${SEESTAR_DNSHOOK_PROBE:-1}
      DNSHOOK_PROBE_MS: ${SEESTAR_DNSHOOK_PROBE_MS:-1500}
      # comma-separated addresses to put first among the ones that answered (optional)
      DNSHOOK_PREFER: ${SEESTAR_DNSHOOK_PREFER:-}
      # 1 = carry the session over TUTK's TCP relay instead of a UDP hole punch; the punch does
      # not work from behind a symmetric NAT (Connect_Ex -42/-60 for an hour, 2026-10-30).
      TUTK_TCP_RELAY_ONLY: ${SEESTAR_TUTK_TCP_RELAY_ONLY:-0}
      TUTK_TUNNEL_BUFSIZE: ${SEESTAR_TUTK_TUNNEL_BUFSIZE:-512000}
      # 3 = control, pictures/video, and the file server each on their own P2P session: on a shared
      # one, downloads queued behind the live stream (2026-11-12). 4 = a second route to the file
      # server (local port 81 + offset), which the library downloads over in parallel: one session
      # carries HTTP at ~250-290 KB/s. 2 = the app's control/bulk split.
      TUTK_SESSIONS: ${SEESTAR_TUTK_SESSIONS:-4}
      # IOTC_Setup_P2PConnection_Timeout seconds; 0 = not called (the T SDK did not honour 20)
      TUTK_CONNECT_TIMEOUT_S: ${SEESTAR_TUTK_CONNECT_TIMEOUT_S:-0}
      # the SDK's own log, dumped to the tunnel log after a refused Connect_Ex. 0 = verbose writes
      # several lines per 8 KB packet, under qemu, on the data path (a 4 MB log every ~80 s while a
      # stream ran, 2026-11-12); 2 = info keeps the connect steps. Set 0 to debug a connect.
      TUTK_LOG_DIR: ${SEESTAR_TUTK_LOG_DIR:-/tmp/tutk}
      TUTK_LOG_LEVEL: ${SEESTAR_TUTK_LOG_LEVEL:-2}
    # qemu/bionic's linker calls personality(), which the default seccomp profile blocks.
    security_opt:
      - seccomp:unconfined
    # One network only (the project's default, shared with Astrocontroller): attached to a second,
    # internal network as well, the ThroughTek P2P setup fails (Connect_Ex -42 / -60).

volumes:
  seestar-portfwd-state:
